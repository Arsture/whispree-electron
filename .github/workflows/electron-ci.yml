name: Electron CI

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  verify-and-package:
    name: Verify and package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate workflow safety
        run: npm run check:workflows

      - name: Check process-boundary imports
        run: npm run check:boundaries

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Package Electron app
        run: npm run package

      - name: Upload packaged app
        uses: actions/upload-artifact@v4
        with:
          name: whispree-electron-${{ matrix.os }}
          path: out/**
          if-no-files-found: error
          retention-days: 14
