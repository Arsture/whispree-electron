name: Legacy Sparkle Release Notes (manual gated)

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: GitHub release ID whose body should be rendered into legacy Sparkle release notes.
        required: true
        type: string
      confirm_legacy_sparkle_notes:
        description: Type "I understand this updates legacy Sparkle release notes" to deploy the legacy notes page.
        required: true
        type: string

jobs:
  update-notes:
    if: ${{ github.event.inputs.confirm_legacy_sparkle_notes == 'I understand this updates legacy Sparkle release notes' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch release body
        run: |
          gh api repos/${{ github.repository }}/releases/${{ github.event.inputs.release_id }} --jq '.body // ""' > release-body.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate release notes HTML
        run: |
          mkdir -p deploy
          python3 .github/scripts/md-to-html.py release-body.md deploy/release-notes.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          keep_files: true
