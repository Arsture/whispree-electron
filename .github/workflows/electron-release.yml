name: Electron Release (manual gated)

on:
  workflow_dispatch:
    inputs:
      confirm_electron_release:
        description: Type "I understand this builds Electron release artifacts" to run make/sign/notarization gates.
        required: true
        type: string
      upload_draft_release:
        description: Upload artifacts to a draft GitHub Release after make succeeds.
        required: true
        default: false
        type: boolean
      tag_name:
        description: Existing or new tag name for draft upload, for example v0.1.0-electron. Required only when upload_draft_release is true.
        required: false
        type: string

permissions:
  contents: write

jobs:
  make-electron:
    if: ${{ github.event.inputs.confirm_electron_release == 'I understand this builds Electron release artifacts' }}
    name: Make Electron artifacts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest

    env:
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      WINDOWS_CERTIFICATE_FILE: ${{ secrets.WINDOWS_CERTIFICATE_FILE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
      AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Electron source before release make
        run: npm run verify

      - name: Signing and notarization preflight
        run: npm run signing:preflight:release

      - name: Runtime readiness probe
        run: npm run probe:real

      - name: Make Electron artifacts
        run: npm run make

      - name: Upload make artifacts
        uses: actions/upload-artifact@v4
        with:
          name: whispree-electron-release-${{ matrix.os }}
          path: out/make/**
          if-no-files-found: error
          retention-days: 30

      - name: Upload draft GitHub Release artifacts
        if: ${{ github.event.inputs.upload_draft_release == 'true' && github.event.inputs.tag_name != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          name: Whispree Electron ${{ github.event.inputs.tag_name }}
          draft: true
          prerelease: true
          files: out/make/**
